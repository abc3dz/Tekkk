[package]
name = "Tekkk"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {
    version = "0.18",
    features = ["debug"]
}
avian3d = "0.6"
bevy_framepace = "0.20"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }